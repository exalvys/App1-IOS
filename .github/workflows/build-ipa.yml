
name: Build WelcomeApp IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project WelcomeApp.xcodeproj \
            -scheme WelcomeApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Verify app binary
        run: |
          echo "=== Type du fichier ==="
          file build/Build/Products/Release-iphoneos/WelcomeApp.app/WelcomeApp

          echo "=== Architecture du binaire ==="
          xcrun lipo -info build/Build/Products/Release-iphoneos/WelcomeApp.app/WelcomeApp

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/WelcomeApp.app Payload/
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload WelcomeApp.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WelcomeApp-IPA
          path: WelcomeApp.ipa
          if-no-files-found: error
