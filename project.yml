name: WelcomeApp
options:
  bundleIdPrefix: fr.exalvys
  deploymentTarget:
    iOS: "16.0"
targets:
  WelcomeApp:
    type: application
    platform: iOS
    sources:
      - WelcomeApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.exalvys.welcomeapp
        PRODUCT_NAME: WelcomeApp
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Welcome
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
